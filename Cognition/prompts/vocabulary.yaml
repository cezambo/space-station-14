# Words shown to Jev and the LLMs for each category produced by Core/Perception/Categorizers.cs (P7).
# Keys are the snake_case enum names; every enum value must have a word (checked at load).
distance: # RP-05
  within_reach: "within reach"
  near: "near"
  medium: "medium distance"
  far: "far"
direction: # RP-05, clockwise from north
  north: "north"
  north_east: "northeast"
  east: "east"
  south_east: "southeast"
  south: "south"
  south_west: "southwest"
  west: "west"
  north_west: "northwest"
need_band: # RP-08
  ok: "ok"
  mild: "mild"
  strong: "strong"
  critical: "critical"
day_phase: # RS-07, e.g. "your day 12, late"
  early: "early"
  middle: "midway"
  late: "late"
  overdue: "long past due for sleep"
budget_band: # RJ-09
  empty: "exhausted"
  low: "low"
  some: "some left"
  plenty: "plenty"
sensation: # RP-06
  almost_no_air: "almost no air"
  thin_air: "thin air"
  heavy_air: "heavy, pressing air"
  crushing_pressure: "crushing pressure"
  freezing_cold: "freezing cold"
  cold: "cold"
  hot: "hot"
  scorching_heat: "scorching heat"
  fire: "fire"
  puddle: "a puddle of {{reagent}}" # gas sensations use the 'gas' section instead
gas: # sensed at or above perception.environment.gas_notice_kpa; unlisted gases (oxygen, nitrogen) are not sensed
  plasma: "smell of plasma"
  tritium: "sharp metallic smell"
  carbon_dioxide: "stale, stuffy air"
  nitrous_oxide: "sweet smell"
  ammonia: "sharp ammonia smell"
  water_vapor: "humid air"
  frezon: "icy chemical smell"
damage_band: # RP-07, thresholds in perception.damage_bands
  minor: "minor"
  moderate: "moderate"
  serious: "serious"
  severe: "severe"
speech_verb: # RP-03
  whisper: "whispering"
  normal: "saying"
  shout: "shouting"
need: # RP-08
  hunger: "hunger"
  thirst: "thirst"
  fatigue: "fatigue"
  body_temperature: "body temperature"
  oxygen: "breathing"
perception: # T1.12 block layout; placeholders are fixed per phrase (checked at load)
  seen_header: "SEEN:"
  heard_header: "HEARD:"
  environment_header: "ENVIRONMENT:"
  body_header: "BODY:"
  line: "- {{text}}"
  field_separator: " — "
  list_separator: "; "
  list_and: " and "
  nothing: "nothing notable"
  none: "none"
  known: "{{name}} (known)"
  holding: "holding {{items}}"
  looks: "looks {{trait}}"
  here: "right here"
  position: "{{distance}}, {{direction}}"
  heard_line: "{{speaker}}, {{position}}, {{verb}}{{to_you}}: \"{{text}}\""
  to_you: " to you"
  air_normal: "air normal"
  need: "{{need}} {{band}}"
  damage: "{{band}} {{type}} damage"
  pain: "{{band}} pain"
  bleeding: "bleeding"
menu: # T1.15 decision menu option descriptions (RJ-16: self-explanatory; RJ-20: descriptions in criteria)
  category_nothing: "Keep doing the current action"
  category_move: "Walk somewhere"
  category_interact: "Interact with something within reach, such as a door or a person"
  category_use_item: "Use, eat or drink an item being held"
  category_inventory: "Pick up, drop, store, take out or hand over an item"
  category_speak: "Say something to someone"
  category_think: "Stop to think carefully about plans"
  category_sleep: "Go to sleep"
  at: "{{text}} ({{position}})"
  in_hand: "in hand"
  walk_to: "Walk to {{target}}"
  none_of_these: "None of these places fits what they want"
  walk_direction: "Walk {{direction}}"
  open: "Open {{target}}"
  close: "Close {{target}}"
  lock: "Lock {{target}} with {{item}}"
  unlock: "Unlock {{target}} with {{item}}"
  wake: "Wake up {{target}}"
  use: "Use {{item}}"
  use_on: "Use {{item}} on {{target}}"
  eat: "Eat {{item}}"
  drink: "Drink {{item}}"
  pickup: "Pick up {{item}}"
  drop: "Drop {{item}}"
  put: "Put {{item}} into {{target}}"
  take: "Take {{item}} out of {{target}}"
  give: "Give {{item}} to {{target}}"
  speak_to: "Speak to {{target}}"
  speak_everyone: "Speak to everyone who can hear"
  think_light: "Think briefly about what to do next (cheap)"
  think_deep: "Reconsider plans thoroughly using everything they know (expensive)"
  sleep_here: "Lie down and sleep right here"
  sleep_this_bed: "Sleep in the bed right here"
  sleep_bed: "Walk to {{target}} and sleep there"
  nearest: "{{text}}, the nearest one"
action: # T1.21 past-tense verb shown in a memory sentence
  move: "walked to"
  pickup: "picked up"
  drop: "dropped"
  use: "used"
  open: "opened"
  close: "closed"
  lock: "locked"
  unlock: "unlocked"
  put: "put"
  take: "took"
  eat: "ate"
  drink: "drank"
  sleep: "lay down on"
  wake: "woke"
  speak: "spoke to"
  give: "gave"
memory: # T1.21 recent-memory sentences (RMe-01). Counts are words, never digits.
  did: "I {{verb}} {{what}}."
  did_again: "I {{verb}} {{what}}, {{times}}."
  failed: "I could not {{verb}} {{what}}."
  failed_again: "I could not {{verb}} {{what}}, {{times}}."
  failed_because: "I could not {{verb}} {{what}}, because {{reason}}."
  failed_because_again: "I could not {{verb}} {{what}}, because {{reason}}, {{times}}."
  said: "I said: \"{{text}}\"."
  thought: "I thought: {{text}}"
  hurt: "I was hurt."
  hurt_again: "I was hurt, {{times}}."
  hurt_kind: "I was hurt: {{kind}}."
  hurt_kind_again: "I was hurt: {{kind}}, {{times}}."
  fell_asleep: "I fell asleep."
  fell_asleep_where: "I fell asleep in {{where}}."
  woke: "I woke up."
  collapsed: "I collapsed."
  collapsed_again: "I collapsed, {{times}}."
  unconscious: "I lost consciousness."
  unconscious_again: "I lost consciousness, {{times}}."
  give_what: "{{item}} to {{target}}"
  put_what: "{{item}} into {{target}}"
  take_what: "{{item}} out of {{target}}"
  lock_what: "{{target}} with {{item}}"
  use_what: "{{item}} on {{target}}"
  something: "something"
  times_couple: "a couple of times"
  times_several: "several times"
  times_many: "many times"
goal_stopwords: [ "find", "keep", "make", "sure", "something", "someone", "anyone", "every", "with", "from", "that", "this", "their", "there", "into", "have", "more", "some", "what", "when", "where", "which", "while", "about", "after", "before", "other", "than", "then", "them", "they", "will", "your", "being", "enough", "nobody" ]
