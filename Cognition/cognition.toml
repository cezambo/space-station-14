# All numeric defaults marked (E-xx) are calibrated by experiments (requirements §18).

[providers.jev]
base_url = "https://api.typesafe.ai/v1"
model = "jev-1.13.0" # pinned; never replaced by an LLM (P3, RM-02)
api_key_env = "TYPESAFE_API_KEY"
timeout_ms = 2000
max_retries = 3
max_rps = 10 # ≤50% of 1200/min (RC-01)
backoff_initial_ms = 500 # doubled per attempt; defaults of the official SDK RetryPolicy
backoff_max_ms = 5000
backoff_jitter = 0.25 # fraction randomly subtracted from each delay
# The response carries token counts only; USD is computed from these (docs.typesafe.ai/models).
input_price_usd_per_mtok = 0.042
output_price_usd_per_mtok = 0.0

# Any OpenAI-compatible /chat/completions endpoint (RM-03). For a local server (llama.cpp, Ollama, tinyllm):
# api_key_env = "" (no auth), reasoning_effort = "" (not sent), require_parameters = false, prices 0.
# Prices are only used to estimate the live cost cap; OpenRouter reports the real cost in usage.cost.
# glm-5.3 models accept reasoning_effort max | high | low only; reasoning is mandatory (GET /models, 2026-09-28).
[providers.llm.light]
base_url = "https://openrouter.ai/api/v1"
model = "z-ai/glm-5.3-flash"
reasoning_effort = "low"
api_key_env = "OPENROUTER_API_KEY"
timeout_ms = 20000
max_rps = 5
max_retries = 2
backoff_initial_ms = 500
backoff_max_ms = 5000
backoff_jitter = 0.25
structured_output = "json_schema" # json_schema | json_object | none; replies are validated locally anyway
require_parameters = true # OpenRouter: route only to providers that honor response_format/reasoning
reasoning_allowance_tokens = 2000 # added to the template's output limit, since reasoning counts as output (E-xx)
input_price_usd_per_mtok = 0.15
output_price_usd_per_mtok = 0.50

[providers.llm.heavy]
base_url = "https://openrouter.ai/api/v1"
model = "z-ai/glm-5.3"
reasoning_effort = "max"
api_key_env = "OPENROUTER_API_KEY"
timeout_ms = 120000
max_rps = 2
max_retries = 2
backoff_initial_ms = 1000
backoff_max_ms = 10000
backoff_jitter = 0.25
structured_output = "json_schema"
require_parameters = true
reasoning_allowance_tokens = 16000
input_price_usd_per_mtok = 1.40
output_price_usd_per_mtok = 4.40

[replay]
mode = "replay" # live | record | replay | replay-strict (CI)
dir = "fixtures/replay"

[live_guard]
max_cost_usd_per_run = 2.00 # RDev-04

[decision] # (E-03)
min_interval_s = 1.0
max_interval_s = 8.0
idle_max_interval_s = 20.0
emotion_every_n = 5
shortlist_top = 30 # RJ-04: menus over 255 options -> Score shortlist -> Choice over the best 30
shortlist_batch = 50 # Score questions per shortlist call
fanout = "full" # full | reduced — T1.03b: billed per call, so full (docs/reports/T1.03b-billing.md)

[scheduler]
w_urgency = 1.0
w_wait = 0.5
w_visible = 0.3

[thresholds] # RJ-18, per question (E-04)
action_confidence = 0.35
memory_keep = 0.55
memory_importance_new_opinion = 4 # Score level, ordinal (RJ-19)
goal_relevance = 0.60
goal_blocked = 0.60
goal_valid = 0.50
goal_done = 0.70
temporal_fail = 0.40 # fail if P(yes) >= this
emotion_op_valid = 0.60
modifier_dedupe_confidence = 0.50
personality_change = 0.70
speech_stale_ok = 0.50

[context]
target_tokens = 4000
hard_cap_tokens = 32000
chars_per_token_initial = 4.0
calibration_rate = 0.1 # T1.14: step of the per-block chars/token fit to billed input tokens (NLMS, 0 < rate <= 1)

[context.block_targets] # §9.3 target tokens per block; exceeding one is logged, never trimmed by itself
instructions = 500
general = 100
goals = 250
personality = 250
emotion = 120
current_action = 200
perception = 900
recent_memory = 900
daily_memory = 350
opinions = 150
menus = 400

[perception] # RP-04, RP-05
max_entities = 8
max_items = 5
max_env = 5
max_sounds = 5
band_within_reach = 1.5
band_near = 5.0
band_medium = 12.0
hearing_whisper = 2.0
hearing_normal = 10.0
hearing_shout = 20.0
wall_attenuation = 0.6
damage_bands = [10, 30, 60] # RP-07: damage/pain where moderate, serious, severe start; below: minor (Q-7)

[perception.salience] # T1.12: weighted proximity + novelty + goal keyword match + danger
proximity = 1.0 # × 1 / (1 + distance in tiles)
novelty = 0.5
goal = 0.8
danger = 1.0
danger_traits = ["bleeding", "badly injured", "unconscious", "on fire"]

[perception.environment] # RP-06. Hazard values from SS14; warning values: SS14 for pressure, ours for temperature (Q-4)
pressure_hazard_low_kpa = 20.0 # Atmospherics.HazardLowPressure → "almost no air"
pressure_warning_low_kpa = 50.0 # Atmospherics.WarningLowPressure → "thin air"
pressure_warning_high_kpa = 385.0 # Atmospherics.WarningHighPressure → "heavy air"
pressure_hazard_high_kpa = 550.0 # Atmospherics.HazardHighPressure → "crushing pressure"
temp_freezing_k = 260.0 # TemperatureDamageComponent.ColdDamageThreshold → "freezing cold"
temp_cold_k = 273.15 # 0 °C → "cold"
temp_hot_k = 323.15 # 50 °C → "hot"
temp_scorching_k = 360.0 # TemperatureDamageComponent.HeatDamageThreshold → "scorching heat"
gas_notice_kpa = 0.5 # a listed gas at or above this partial pressure is sensed

[needs] # RP-08 severities for needs the adapter reports as physical values (Q-7)
oxygen_full_severity_drop = 0.5 # saturation drop (1 - SpO2) that counts as severity 100
body_temp_normal_k = 310.15
body_temp_full_severity_k = 10.0 # |T - normal| that counts as severity 100

[needs.bands] # RP-08: severity 0-100 where mild, strong, critical start
fatigue = [60, 80, 95] # RS-02
hunger = [60, 80, 95] # not specified; same as fatigue for now (Q-4)
thirst = [60, 80, 95]
body_temperature = [60, 80, 95]
oxygen = [60, 80, 95]

[speech]
min_interval_s = 6.0
stale_after_s = 10.0
max_sentences = 2

[budget] # (E-06)
daily_units = 20
light_cost = 1
deep_cost = 6
band_bounds = [0.3, 0.6] # remaining/daily where "some" and "plenty" start; below: "low"; 0: "empty" (Q-4)

[emotion] # (E-05)
labels = ["joy","trust","fear","surprise","sadness","disgust","anger","anticipation","neutral"]
beta = 2.0
alpha = 0.6
decay = "linear" # linear | exponential
secondary_min_p = 0.25
max_modifiers = 6
max_duration_days = 60

[emotion.intensity_map]
faint = 0.15
mild = 0.30
moderate = 0.50
strong = 0.70
overwhelming = 0.90

[emotion.duration_map_days]
"days" = 3
"about a week" = 7
"a few weeks" = 21
"about a month" = 30
"about two months" = 60

[opinion] # (E-01)
stubbornness_default = 5
stubbornness_by_tag = { stubborn = 8, fickle = 3 }
stubbornness_cap = "none" # none | 2x | 3x
buffer_decay_days = 0 # 0 = off
synergy_increment = [1, 2] # [agrees, strongly_agrees]
stubbornness_decay_days = 0
max_in_context = 3
max_regenerations = 2
temporal_regex = "\\b(yesterday|today|tonight|tomorrow|recently|lately|last (night|week|month)|this (morning|afternoon|evening|week)|ago|earlier|on day \\d+|the other day)\\b"

[sleep] # (E-02)
t_wake_minutes = 40
full_sleep_minutes = 4
min_consolidated_seconds = 90
min_fatigue_for_day_end = 40
bed_recovery_multiplier = 1.5
day_phase_bounds = [0.33, 0.75, 1.0] # t_awake/T_wake where middle, late, overdue start; below: early (Q-4)

[memory]
recent_hard_cap = 400
aggregate_window_s = 10
daily_buffer_min = 5
daily_compact_at = 20
daily_compact_count = 15
daily_words_min = 120
daily_words_max = 300

[consolidation]
step_max_retries = 2

[persistence]
sqlite_path = "data/minds.sqlite"

[telemetry]
dir = "logs"
