name: Cognition

# Cognitive core CI (RDev-04): replay-strict, no API keys, zero cost.
on:
  push:
    branches: [ master ]
    paths: [ 'Cognition/**', '.github/workflows/cognition.yml' ]
  pull_request:
    paths: [ 'Cognition/**', '.github/workflows/cognition.yml' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COGNITION_REPLAY_MODE: replay-strict
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    defaults:
      run:
        working-directory: Cognition

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore Cognition.sln

    - name: Format check
      run: dotnet format Cognition.sln --verify-no-changes --no-restore

    - name: Build
      run: dotnet build Cognition.sln --configuration Release --no-restore

    - name: Validate cognition.toml
      run: dotnet run --project src/Cognition.Eval --configuration Release --no-build -- check-config

    - name: Test
      run: dotnet test Cognition.sln --configuration Release --no-build
